version = "1.0.0"

[object_store]
# Use "s3" for AWS S3, Backblaze B2, Cloudflare R2, or another compatible store.
provider = "local"
local_root = "data/object_store"
bucket = ""
prefix = "artsearch"
endpoint_url = ""
region = ""
upload_concurrency = 8
upload_checkpoint_batch_size = 256
upload_max_attempts = 4
upload_retry_base_seconds = 0.5
publish_corpus_renditions = true
corpus_source = "raw"
corpus_role = "original"
corpus_namespace = "corpus/originals"

[manifests]
local_dir = "data/production/manifests"
object_prefix = "manifests"

[postgres]
# SQLite remains the local staging/cache database in development. Enable this
# section for the canonical production metadata publication boundary.
enabled = false
require_tls = false
database_url_env = "DATABASE_URL"
direct_url_env = "DATABASE_DIRECT_URL"
application_name = "artsearch"
pool_size = 5
max_overflow = 5
pool_timeout_seconds = 10
statement_timeout_ms = 15000
telemetry_retention_days = 180
outbox_batch_size = 100
publish_embeddings = true
publish_filter_history = true
publish_run_history = true

[qdrant]
# The checked-in development stack supplies this local service. Qdrant Cloud
# uses the separate example config and environment-provided credentials.
# QDRANT_URL overrides this URL; QDRANT_API_KEY is never stored in this file.
enabled = true
url = "http://localhost:6333"
url_env = "QDRANT_URL"
api_key_env = "QDRANT_API_KEY"
require_api_key = false
collection_name = "artworks_clip3_csd1_v2"
alias_name = "artworks_active"
clip_vector_name = "clip_subject"
csd_vector_name = "csd_style"
clip_dimension = 512
csd_dimension = 768
datatype = "float16"
on_disk_vectors = false
on_disk_payload = false
batch_size = 256
timeout_seconds = 30
prefer_grpc = false
hnsw_ef = 128
prefetch_limit = 200
fusion_limit = 100
max_results_per_artist = 2
require_sfw = true
require_bluesky_accept = true
promote_after_sync = true

[faiss]
# Opt-in shadow/scale backend. Snapshots are immutable and data/ is ignored.
enabled = false
artifact_root = "data/indexes/faiss"
active_pointer = "active.json"
alias_name = "artworks_faiss_active"
clip_dimension = 512
csd_dimension = 768
clip_pq_subquantizers = 32
csd_pq_subquantizers = 48
pq_bits = 8
nlist = 4096
nprobe = 32
flat_fallback_threshold = 50000
training_sample_size = 250000
add_batch_size = 4096
prefetch_limit = 500
rerank_limit = 500
fusion_limit = 100
max_results_per_artist = 2
rrf_k = 60
require_sfw = true
require_bluesky_accept = true
minimum_mean_recall = 0.90
maximum_search_p95_ms = 250.0
verify_checksums_on_load = false

[scale_budget]
target_points = 10000000
monthly_budget_usd = 50.0
minimum_headroom_usd = 5.0
vector_host_monthly_usd = 24.0
edge_compute_monthly_usd = 5.0
metadata_database_monthly_usd = 5.0
observability_monthly_usd = 0.0
contingency_monthly_usd = 5.0
object_storage_gb_monthly_usd = 0.015
hot_image_cache_fraction = 0.01
average_cached_image_bytes = 62500
metadata_bytes_per_point = 320
retained_snapshot_copies = 2
store_exact_fp16_rerank_vectors = true

[local_retention]
# Local image paths remain durable in the alpha. The 10M profile opts into
# post-archive cleanup because Bluesky is its canonical media source.
enabled = false
delete_raw = true
delete_processed = true
require_source_reference = true
