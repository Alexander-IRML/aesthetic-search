version = "1.1.0-bulk"
task_name = "ArtSearch Bulk Intake"
timezone = "America/Chicago"
daily_time = "10:00"
latest_start_minutes = 15
require_ac_power = true
candidate_target = 20000
candidates_per_actor = 20
dag_id = "artsearch_bluesky_intake"
compose_file = "orchestration/airflow/compose.yaml"
