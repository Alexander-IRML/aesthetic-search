version = "2.0.0-scale-example"

[object_store]
# Copy this file to a .local.toml path before inserting account-specific values.
provider = "s3"
local_root = "data/object_store"
bucket = "artsearch-artifacts-alpha"
prefix = "artsearch"
endpoint_url = "https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com"
region = "auto"
upload_concurrency = 16
upload_checkpoint_batch_size = 256
upload_max_attempts = 5
upload_retry_base_seconds = 0.5
# Bluesky remains the canonical media source. A bounded hot-cache worker may
# populate compact renditions later, but intake does not upload every image.
publish_corpus_renditions = false
corpus_source = "processed"
corpus_role = "display"
corpus_namespace = "corpus/display"

[manifests]
local_dir = "data/production/manifests"
object_prefix = "manifests"

[postgres]
enabled = true
require_tls = true
database_url_env = "DATABASE_URL"
direct_url_env = "DATABASE_DIRECT_URL"
application_name = "artsearch-scale"
pool_size = 2
max_overflow = 1
pool_timeout_seconds = 10
statement_timeout_ms = 15000
telemetry_retention_days = 90
outbox_batch_size = 100
# FAISS owns serving vectors; Parquet run bundles own historical filter evidence.
publish_embeddings = false
publish_filter_history = false
publish_run_history = false

[qdrant]
# Keep the current alpha config during shadow evaluation. This target profile
# removes the managed-vector bill only after the FAISS promotion gates pass.
enabled = false
url = ""
url_env = "QDRANT_URL"
api_key_env = "QDRANT_API_KEY"
require_api_key = false
collection_name = "artworks_clip3_csd1_v2"
alias_name = "artworks_active"
clip_vector_name = "clip_subject"
csd_vector_name = "csd_style"
clip_dimension = 512
csd_dimension = 768
datatype = "float16"
on_disk_vectors = false
on_disk_payload = false
batch_size = 256
timeout_seconds = 30
prefer_grpc = false
hnsw_ef = 128
prefetch_limit = 200
fusion_limit = 100
max_results_per_artist = 2
require_sfw = true
require_bluesky_accept = true
promote_after_sync = false

[faiss]
enabled = true
artifact_root = "data/indexes/faiss"
active_pointer = "active.json"
alias_name = "artworks_faiss_active"
clip_dimension = 512
csd_dimension = 768
clip_pq_subquantizers = 32
csd_pq_subquantizers = 48
pq_bits = 8
nlist = 4096
nprobe = 32
flat_fallback_threshold = 50000
training_sample_size = 250000
add_batch_size = 4096
prefetch_limit = 500
rerank_limit = 500
fusion_limit = 100
max_results_per_artist = 2
rrf_k = 60
require_sfw = true
require_bluesky_accept = true
minimum_mean_recall = 0.90
maximum_search_p95_ms = 250.0
verify_checksums_on_load = false

[scale_budget]
target_points = 10000000
monthly_budget_usd = 50.0
minimum_headroom_usd = 5.0
vector_host_monthly_usd = 24.0
edge_compute_monthly_usd = 5.0
metadata_database_monthly_usd = 5.0
observability_monthly_usd = 0.0
contingency_monthly_usd = 5.0
object_storage_gb_monthly_usd = 0.015
hot_image_cache_fraction = 0.01
average_cached_image_bytes = 62500
metadata_bytes_per_point = 320
retained_snapshot_copies = 2
store_exact_fp16_rerank_vectors = true

[local_retention]
enabled = true
delete_raw = true
delete_processed = true
require_source_reference = true
