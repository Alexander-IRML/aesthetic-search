version = "1.1.0"

[object_store]
provider = "local"
local_root = "data/object_store"
bucket = ""
prefix = "artsearch"
endpoint_url = ""
region = ""

[manifests]
local_dir = "data/production/manifests"
object_prefix = "manifests"

[qdrant]
# Copy this file to configs/production.qdrant-cloud.local.toml. The local copy
# is ignored. Export QDRANT_URL and QDRANT_API_KEY in the runtime environment.
enabled = true
url = ""
url_env = "QDRANT_URL"
api_key_env = "QDRANT_API_KEY"
require_api_key = true
collection_name = "artworks_clip3_dino1_v1"
alias_name = "artworks_active"
clip_vector_name = "clip_subject"
dino_vector_name = "dino_global"
clip_dimension = 512
dino_dimension = 768
datatype = "float16"
on_disk_vectors = false
on_disk_payload = false
batch_size = 256
timeout_seconds = 30
prefer_grpc = false
hnsw_ef = 128
prefetch_limit = 200
fusion_limit = 100
patch_rerank_limit = 50
max_results_per_artist = 2
require_sfw = true
require_bluesky_accept = true
promote_after_sync = true
