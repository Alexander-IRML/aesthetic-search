version = "1.2.0"

[object_store]
# Copy to production.alpha-cloud.local.toml and replace YOUR_ACCOUNT_ID.
# The local file is ignored. R2 credentials remain in the AWS environment chain.
provider = "s3"
local_root = "data/object_store"
bucket = "artsearch-artifacts-alpha"
prefix = "artsearch"
endpoint_url = "https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com"
region = "auto"
upload_concurrency = 16
upload_checkpoint_batch_size = 256
upload_max_attempts = 5
upload_retry_base_seconds = 0.5

[manifests]
local_dir = "data/production/manifests"
object_prefix = "manifests"

[postgres]
# DATABASE_URL is the Neon pooled runtime URL. DATABASE_DIRECT_URL is the
# direct endpoint used only by Alembic and one-time bulk/cutover operations.
enabled = true
require_tls = true
database_url_env = "DATABASE_URL"
direct_url_env = "DATABASE_DIRECT_URL"
application_name = "artsearch-alpha"
pool_size = 5
max_overflow = 5
pool_timeout_seconds = 10
statement_timeout_ms = 15000
telemetry_retention_days = 180
outbox_batch_size = 100

[qdrant]
# QDRANT_URL and QDRANT_API_KEY come from the runtime environment.
enabled = true
url = ""
url_env = "QDRANT_URL"
api_key_env = "QDRANT_API_KEY"
require_api_key = true
collection_name = "artworks_clip3_csd1_v2"
alias_name = "artworks_active"
clip_vector_name = "clip_subject"
csd_vector_name = "csd_style"
clip_dimension = 512
csd_dimension = 768
datatype = "float16"
on_disk_vectors = false
on_disk_payload = false
batch_size = 256
timeout_seconds = 30
prefer_grpc = false
hnsw_ef = 128
prefetch_limit = 200
fusion_limit = 100
max_results_per_artist = 2
require_sfw = true
require_bluesky_accept = true
promote_after_sync = true
