version = "1.0.0"
task_name = "ArtSearch Daily Intake"
timezone = "America/Chicago"
daily_time = "10:00"
latest_start_minutes = 15
require_ac_power = true
candidate_target = 5000
candidates_per_actor = 20
dag_id = "artsearch_bluesky_intake"
compose_file = "orchestration/airflow/compose.yaml"
actors_file = "config/bluesky_actors.local.txt"
filter_config = "configs/artwork_filter.default.toml"
production_config = "configs/production.default.toml"
minimum_free_gb = 25
startup_timeout_seconds = 600
run_timeout_seconds = 50400
poll_seconds = 30
restart_count = 2
restart_interval_minutes = 5
