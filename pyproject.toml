[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aesthetic-search"
version = "0.1.0"
description = "Data preparation pipeline for ArtSearch visual similarity search."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "imagehash>=4.3.1",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
artsearch-init-db = "artsearch.ingest.cli:init_db_main"
artsearch-register-artists = "artsearch.ingest.cli:register_artists_main"
artsearch-standardize = "artsearch.ingest.cli:standardize_main"

[tool.hatch.build.targets.wheel]
packages = ["src/artsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"