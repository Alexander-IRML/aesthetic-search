[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aesthetic-search"
version = "0.6.0"
description = "Data preparation pipeline for ArtSearch visual similarity search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28.0",
    "imagehash>=4.3.1",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
embed = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "transformers>=4.49.0",
    "safetensors>=0.4.0",
]
filter = [
    "torch>=2.3.0",
    "transformers>=4.49.0",
]
data = [
    "polars>=1.37.0,<2.0.0",
    "s3fs>=2025.3.0,<2027.0.0",
]
qdrant = [
    "qdrant-client>=1.18.0,<1.19.0",
]
api = [
    "fastapi>=0.141.1,<0.142.0",
    "python-multipart>=0.0.32,<0.1.0",
    "uvicorn>=0.51.0,<0.52.0",
]
postgres = [
    "alembic>=1.14.0,<2.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
]
spark = [
    "pyspark>=4.1.0,<4.3.0",
]
dev = [
    "alembic>=1.14.0,<2.0.0",
    "fastapi>=0.141.1,<0.142.0",
    "pgvector>=0.3.6,<1.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.32,<0.1.0",
    "qdrant-client>=1.18.0,<1.19.0",
    "ruff>=0.5.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "uvicorn>=0.51.0,<0.52.0",
]

[project.scripts]
artsearch-init-db = "artsearch.ingest.cli:init_db_main"
artsearch-register-artists = "artsearch.ingest.cli:register_artists_main"
artsearch-standardize = "artsearch.ingest.cli:standardize_main"
artsearch-embed = "artsearch.embed.cli:embed_main"
artsearch-search-demo = "artsearch.retrieval.cli:search_demo_main"
artsearch-gallery-demo = "artsearch.retrieval.cli:gallery_demo_main"
artsearch-open-gallery = "artsearch.retrieval.cli:open_gallery_main"
artsearch-retrieval-evaluate = "artsearch.retrieval.cli:retrieval_evaluate_main"
artsearch-artwork-filter = "artsearch.artwork_filter.cli:main"
artsearch-bluesky-collect = "artsearch.bluesky.cli:main"
artsearch-bluesky-pipeline = "artsearch.bluesky_pipeline_cli:main"
artsearch-rebuild-bluesky-corpus = "artsearch.bluesky_corpus_cli:main"
artsearch-data = "artsearch.production.cli:main"
artsearch-qdrant = "artsearch.retrieval.qdrant_cli:main"
artsearch-model-dashboard = "artsearch.monitoring.cli:main"
artsearch-intake = "artsearch.production.scheduler:main"
artsearch-deploy = "artsearch.deployment.cli:main"
artsearch-postgres = "artsearch.postgres.cli:main"
artsearch-api = "artsearch.api.cli:main"
artsearch-csd-benchmark = "artsearch.embed.csd_benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
