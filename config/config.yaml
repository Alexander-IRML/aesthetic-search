paths:
  raw_dir: data/raw
  processed_dir: data/processed
  database: data/artsearch.db

images:
  canonical_size: 448
  crop_threshold: 2.5
  output_format: jpeg
  jpeg_quality: 95
  padding_fill_strategy: neutral_gray
  neutral_gray_value: 128

duplicates:
  phash_distance_threshold: 6

models:
  clip_model_name: openai/clip-vit-base-patch32
  clip_model_version: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
  dino_model_name: facebook/dinov2-with-registers-base
  dino_model_version: a1d738ccfa7ae170945f210395d99dde8adb1805

embeddings:
  batch_size: 4
  device: cpu

retrieval:
  default_top_k: 12
  shortlist_size: 100
  patch_match_top_n: 1
  review_session_count: 3
  demo_output: data/search_demo.html
  gallery_output: data/search_gallery.html
